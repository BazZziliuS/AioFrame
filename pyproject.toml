[project]
name = "aioframe"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "aiogram>=3.34.0",
    "aiohttp>=3.14.5",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "apscheduler>=3.11.3,<4",
    "cachetools>=8.0.2",
    "colorama>=0.4.6",
    "colorlog>=6.12.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.9",
    "tzdata>=2025.2; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint.isort]
combine-as-imports = true
