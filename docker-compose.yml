# Default: bot + SQLite in the `bot-data` volume.
# Full stack: `docker compose --profile full up -d` and in .env set
#   DATABASE_URL=postgresql+asyncpg://bot:bot@postgres:5432/bot
#   REDIS_URL=redis://redis:6379/0
services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides the local paths from .env with the container volume
      DATABASE_URL: ${DOCKER_DATABASE_URL:-sqlite+aiosqlite:////app/data/database.db}
      PATH_LOGS: /app/data/logs.log
    volumes:
      - bot-data:/app/data
    ports:
      - "${WEBAPP_PORT:-8080}:8080"  # used only in webhook mode

  postgres:
    image: postgres:18-alpine
    profiles: ["full"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: bot
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    profiles: ["full"]
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  bot-data:
  postgres-data:
  redis-data:
